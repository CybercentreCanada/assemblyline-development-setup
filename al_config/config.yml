auth:
  internal:
    signup:
      enabled: true
  ldap:
    enabled: true
    uid_field: "cn"
    bind_user: cn=admin,dc=assemblyline,dc=local
    bind_pass: admin
  oauth:
    enabled: true
    gravatar_enabled: false
    providers:
      keycloak:
        auto_create: true
        allow_external_tokens: true
        external_token_alternate_audiences:
          - "account"
        azp_role_limits:
          clue:
            - submission_view
            - badlist_view
            - safelist_view
            - alert_view
            - submission_create
        auto_properties:
          - field: email
            pattern: .*
            type: access
            value: true
          - field: scope
            pattern: assemblyline_submission_view
            type: role
            value: submission_view
          - field: scope
            pattern: assemblyline_badlist_view
            type: role
            value: badlist_view
          - field: scope
            pattern: assemblyline_safelist_view
            type: role
            value: safelist_view
          - field: scope
            pattern: assemblyline_alert_view
            type: role
            value: alert_view
          - field: scope
            pattern: assemblyline_submission_create
            type: role
            value: submission_create
        client_id: assemblyline
        client_secret: assemblyline
        client_kwargs:
          scope: openid email profile
        openid_connect_discovery_url: http://localhost:8080/realms/master/.well-known/openid-configuration
core:
  redis:
    nonpersistent:
      host: localhost
    persistent:
      host: localhost
      port: 6379

datastore:
  hosts: [http://elastic:devpass@localhost:9200]
  archive:
    enabled: true

filestore:
  cache:
    [
      "s3://al_storage_key:Ch@ngeTh!sPa33w0rd@localhost:9000?s3_bucket=al-cache&use_ssl=False",
    ]
  storage:
    [
      "s3://al_storage_key:Ch@ngeTh!sPa33w0rd@localhost:9000?s3_bucket=al-storage&use_ssl=False",
    ]
  archive:
    [
      "s3://al_storage_key:Ch@ngeTh!sPa33w0rd@localhost:9000?s3_bucket=al-archive&use_ssl=False",
    ]

services:
  image_variables:
    # Local Docker registry for development service images
    PRIVATE_REGISTRY: localhost:32000/
  allow_insecure_registry: true

system:
  type: development

ui:
  debug: true
  validate_session_useragent: false
  validate_session_ip: false  
  enforce_quota: false
